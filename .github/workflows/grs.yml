name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GH_STATS_TOKEN availability
        id: check_token
        run: |
          if [ -z "${{ secrets.GH_STATS_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GH_STATS_TOKEN secret is not configured. Skipping stats and streak card generation."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate stats card
        if: steps.check_token.outputs.has_token == 'true'
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=nightowl&hide_border=true&bg_color=1a1b4b&title_color=e8d5a3&icon_color=8b9fd4&text_color=c9d1d9&ring_color=2f2f9c&card_width=380
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate streak card
        if: steps.check_token.outputs.has_token == 'true'
        uses: DenverCoder1/github-readme-streak-stats@v2
        with:
          options: user=${{ github.repository_owner }}&theme=nightowl&hide_border=true&disable_animations=true&background=1a1b4b&ring=2f2f9c&fire=e8d5a3&currStreakLabel=8b9fd4&card_width=380
          path: profile/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark
            profile/github-contribution-grid-snake.svg?palette=github

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile activity cards" || exit 0
          git push
