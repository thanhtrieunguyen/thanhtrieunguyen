<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
                style='isolation: isolate' viewBox='0 0 380 195' width='380px' height='195px' direction='ltr'>
        
        <defs>
            <clipPath id='outer_rectangle'>
                <rect width='380' height='195' rx='4.5'/>
            </clipPath>
            <mask id='mask_out_ring_behind_fire'>
                <rect width='380' height='195' fill='white'/>
                <ellipse id='mask-ellipse' cx='190' cy='32' rx='13' ry='18' fill='black'/>
            </mask>
            
        </defs>
        <g clip-path='url(#outer_rectangle)'>
            <g style='isolation: isolate'>
                <rect stroke='#000000' stroke-opacity='0' fill='#0d1117' rx='4.5' x='0.5' y='0.5' width='379' height='194'/>
            </g>
            <g style='isolation: isolate'>
                <line x1='126.66666666667' y1='28' x2='126.66666666667' y2='170' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#E4E2E2' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
                <line x1='253.33333333333' y1='28' x2='253.33333333333' y2='170' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#E4E2E2' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
            </g>
            <g style='isolation: isolate'>
                <!-- Total Contributions big number -->
                <g transform='translate(63.333333333333, 48)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#C792EA' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        895
                    </text>
                </g>

                <!-- Total Contributions label -->
                <g transform='translate(63.333333333333, 84)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#C792EA' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        <tspan x='0' dy='-9'>Total</tspan><tspan x='0' dy='16'>Contributions</tspan>
                    </text>
                </g>

                <!-- Total Contributions range -->
                <g transform='translate(63.333333333333, 114)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#7FDBCA' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        <tspan x='0' dy='0'>Dec 28, 2022</tspan><tspan x='0' dy='16'>- Present</tspan>
                    </text>
                </g>
            </g>
            <g style='isolation: isolate'>
                <!-- Current Streak label -->
                <g transform='translate(190, 108)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#8b9fd4' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Current Streak
                    </text>
                </g>

                <!-- Current Streak range -->
                <g transform='translate(190, 145)'>
                    <text x='0' y='21' stroke-width='0' text-anchor='middle' fill='#7FDBCA' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Jul 17
                    </text>
                </g>

                <!-- Ring around number -->
                <g mask='url(#mask_out_ring_behind_fire)'>
                    <circle cx='190' cy='71' r='40' fill='none' stroke='#2f2f9c' stroke-width='5' style='opacity: 1; opacity: 1;'></circle>
                </g>
                <!-- Fire icon -->
                <g transform='translate(190, 19.5)' stroke-opacity='0' style='opacity: 1; opacity: 1;'>
                    <path d='M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z' fill='none'/>
                    <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#e8d5a3' stroke-opacity='0'/>
                </g>

                <!-- Current Streak big number -->
                <g transform='translate(190, 48)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#FFEB95' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='font-size: 28px;'>
                        0
                    </text>
                </g>

            </g>
            <g style='isolation: isolate'>
                <!-- Longest Streak big number -->
                <g transform='translate(316.66666666667, 48)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#C792EA' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        27
                    </text>
                </g>

                <!-- Longest Streak label -->
                <g transform='translate(316.66666666667, 84)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#C792EA' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Longest Streak
                    </text>
                </g>

                <!-- Longest Streak range -->
                <g transform='translate(316.66666666667, 114)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#7FDBCA' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Jan 9 - Feb 4
                    </text>
                </g>
            </g>
            
        </g>
    </svg>
